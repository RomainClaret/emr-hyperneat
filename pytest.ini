[pytest]
# A bare `pytest` from the repository root reads this file: it runs the package tests and never
# collects the TensorNEAT submodule's own tests, whose root __init__.py puts third_party/ on every
# worker's path, after which `import tensorneat` resolves to the submodule root and fails (as in
# 0.1.0, which has no root pytest.ini). `pytest emr_hyperneat/tests ...` reads
# emr_hyperneat/tests/pytest.ini instead, the ini file nearest the paths given; everything below
# the discovery lines repeats it, and test_pytest_config.py checks that the two agree.

# Test discovery
testpaths = emr_hyperneat/tests
norecursedirs = third_party build dist .git .replicate *.egg-info
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    multi_gpu: needs 2+ GPU devices (skips on fewer); deselected on GitHub CI, run locally with -m multi_gpu
    cuda: marks tests requiring CUDA
    golden_cpu: exact golden-value regression recorded on CPU with jax==0.6.1 (deselect when changing JAX versions, then re-record)
    paper: re-runs a published paper's simple experiment and asserts its headline finding (select with '-m paper')
    network: needs internet (live Zenodo data-release check; auto-skips when offline)

# Output options
addopts =
    --strict-markers
    -v
    --tb=short
    -ra

# Strict markers to catch typos
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::FutureWarning

# Minimum pytest version
minversion = 7.0

# Console output
console_output_style = progress

# Logging
log_cli = false
log_cli_level = WARNING
