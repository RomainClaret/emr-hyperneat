name: Paper validation

# Re-runs each paper's simplest experiment (real runner code, fixed seed) and checks the
# published finding still holds in the standalone repo. The fast findings gate every push
# and PR; the slow bio smoke runs only on manual dispatch so it never blocks CI.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paper-validation:
    name: Paper findings (fast, CPU)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with the TensorNEAT submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install emr-hyperneat + TensorNEAT
        run: |
          python -m pip install --upgrade pip
          # Pin the JAX stack to the versions the published results were produced on
          # (the golden values are recorded against jax 0.6.1 on CPU).
          pip install "jax==0.6.1" "jaxlib==0.6.1" "numpy<2" "flax==0.10.6" "optax==0.2.4"
          pip install -e .
          pip install -e third_party/tensorneat
          pip install pytest

      - name: Record the runner's CPU model (XLA compiles for the host CPU)
        id: cpu
        run: echo "model=$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | tr -c 'A-Za-z0-9\n' '-')" >> "$GITHUB_OUTPUT"

      - name: Restore the JAX compilation cache
        uses: actions/cache@v6
        with:
          path: .jax_cache
          key: jaxcache-${{ runner.os }}-${{ steps.cpu.outputs.model }}-jax0.6.1-paper-validation-${{ hashFiles('emr_hyperneat/**/*.py', 'third_party/tensorneat/**/*.py') }}
          restore-keys: |
            jaxcache-${{ runner.os }}-${{ steps.cpu.outputs.model }}-jax0.6.1-paper-validation-

      - name: Validate fast paper findings (dyn-func divide, neuromod barrier, base EMR)
        env:
          JAX_PLATFORMS: cpu
          TF_CPP_MIN_LOG_LEVEL: "3"
          # Persistent JIT cache: restored from the previous run, so compiles are paid once
          JAX_COMPILATION_CACHE_DIR: ${{ github.workspace }}/.jax_cache
        run: |
          pytest emr_hyperneat/tests/test_paper_validation.py \
            -m "paper and not slow" -q --tb=short

  paper-validation-slow:
    name: Paper findings (slow bio; manual)
    # Only on manual dispatch -- the bio palette-evolution smoke is too slow to gate pushes.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with the TensorNEAT submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install emr-hyperneat + TensorNEAT
        run: |
          python -m pip install --upgrade pip
          pip install "jax==0.6.1" "jaxlib==0.6.1" "numpy<2" "flax==0.10.6" "optax==0.2.4"
          pip install -e .
          pip install -e third_party/tensorneat
          pip install pytest

      - name: Record the runner's CPU model (XLA compiles for the host CPU)
        id: cpu
        run: echo "model=$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | tr -c 'A-Za-z0-9\n' '-')" >> "$GITHUB_OUTPUT"

      - name: Restore the JAX compilation cache
        uses: actions/cache@v6
        with:
          path: .jax_cache
          key: jaxcache-${{ runner.os }}-${{ steps.cpu.outputs.model }}-jax0.6.1-paper-validation-slow-${{ hashFiles('emr_hyperneat/**/*.py', 'third_party/tensorneat/**/*.py') }}
          restore-keys: |
            jaxcache-${{ runner.os }}-${{ steps.cpu.outputs.model }}-jax0.6.1-paper-validation-slow-

      - name: Validate slow paper finding (bio circadian discovers an oscillatory function)
        env:
          JAX_PLATFORMS: cpu
          TF_CPP_MIN_LOG_LEVEL: "3"
          # Persistent JIT cache: restored from the previous run, so compiles are paid once
          JAX_COMPILATION_CACHE_DIR: ${{ github.workspace }}/.jax_cache
        run: |
          pytest emr_hyperneat/tests/test_paper_validation.py \
            -m "paper and slow" -q --tb=short

  replicate:
    name: Each paper on its own release (manual)
    # Only on manual dispatch: scripts/replicate.py builds every release that papers/releases.json
    # names in its own checkout and environment, then runs that release's fast paper findings
    # there, so a release whose pinned stack no longer installs or reproduces shows up here.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout (all history, for the release tags)
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run each release's fast paper findings in its own checkout
        env:
          JAX_PLATFORMS: cpu
          TF_CPP_MIN_LOG_LEVEL: "3"
        run: |
          releases=$(python -c "import json; print(*sorted(set(json.load(open('papers/releases.json')).values())))")
          for release in $releases; do
            python scripts/replicate.py run --release "$release" -- \
              python -m pytest emr_hyperneat/tests/test_paper_validation.py -m "paper and not slow" -q --tb=short
          done
