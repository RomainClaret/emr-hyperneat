name: CI

# Two tiers, both CPU-only (GitHub runners have no GPU; the multi_gpu-marked tests are
# deselected here and run locally, see docs/testing.md):
#   smoke      every push to main and every PR: install, the XOR smoke script, the fast gate files,
#              and the tests of three nightly-only files that compare no floats.
#   full-suite nightly and on dispatch: the whole non-slow suite, split into shards (1 to 4 balanced
#              by per-file duration, 5 to 7 one process each for the memory-heavy files).
# Both restore a JAX persistent compilation cache from the previous run (actions/cache), so the
# JIT compiles that dominate this suite are paid once per source change, not once per run.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  JAX_PLATFORMS: cpu
  TF_CPP_MIN_LOG_LEVEL: "3"
  # Persistent JIT cache (restored below). Entries are keyed by HLO, so a second fresh
  # EMRHyperNEAT instance with the same configuration hits the cache within the same run too.
  JAX_COMPILATION_CACHE_DIR: ${{ github.workspace }}/.jax_cache
  # Shard assignment for the nightly: every tests/test_*.py file exactly once (a step checks it).
  # Balanced on per-file durations measured with 4 workers. Shards 5 to 7 hold six memory-heavy
  # files and run them in one process: split across xdist workers, every worker would build the
  # same module fixtures (alone in one process, peak memory footprints of about 4.7, 2.8, 4.6, 1.7,
  # 2.9 and 2.1 GiB on an Apple M4 Max, in the order listed). Shards 1 to 4 hand whole files to
  # their two workers (--dist loadfile), so each file's module fixtures are built once.
  SHARDS: |
    1 test_multi_task.py test_hh_cache.py test_smoke.py test_compaction.py test_parity.py test_recurrent_rule.py test_generation_metrics.py test_text_style.py test_multi_device_parity.py test_multi_gpu_worker.py test_paper_imports.py test_pytest_config.py test_continual_learning.py test_prototype_base_settings.py test_custom_levels.py test_node_list.py test_engine_layout.py
    2 test_neuromodulation.py test_geometry_seeding.py test_connection_types.py test_streaming.py test_configuration_parsing.py test_chunked_eval_scan.py test_execution_config.py test_substrate_api.py test_compaction_bucketing.py test_anti_node_rule.py test_unified_recipe.py test_additive_settling.py test_x64.py test_islands.py test_pydantic_deprecations.py test_substrate_neuromodulation_refusals.py
    3 test_dynamic_functions.py test_recurrence_engages.py test_depth_offload.py test_depth_offload_gpu.py test_dynamic_aggregation.py test_prototype_reference.py test_golden.py test_data_release.py test_replicate.py test_substrate_recurrent.py test_pmap_pipeline_class_constraint.py test_palette_evolution.py test_aliases.py test_pipeline_hh_outside_pmap.py test_device_split.py test_vocabulary.py
    4 test_experimental_features.py test_substrate_building.py test_multi_gpu_strategies.py test_paper_validation.py test_forward_pass_modes.py test_depth_lookahead.py test_discovery_chunking.py test_isolation.py test_hh_discovery_per_genome.py test_leo_features.py test_live_palette_strategy.py test_leo_compound_unrescaled.py test_generation_loop.py test_silent_drops.py test_sparse_cap_policy.py
    5 test_substrate_recurrent_neuromodulation.py test_multitask_after_compaction.py
    6 test_global_softmax_axis.py test_substrate_compiled_forward.py
    7 test_guarded_softplus.py test_evaluator_mode_and_list_form.py

jobs:
  smoke:
    name: Smoke + fast gate
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # A superseded push cancels its own gate only; the nightly matrix is never canceled by it.
    concurrency:
      group: smoke-${{ github.ref }}
      cancel-in-progress: true
    # Measured on a GitHub runner (an AMD EPYC 9V74) with an empty compilation cache: install 79 s,
    # smoke 46 s and the fast gate's first command 498 s; the second command's 90 tests are not in
    # these figures.
    timeout-minutes: 40
    steps:
      - name: Checkout (with the TensorNEAT submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install emr-hyperneat + TensorNEAT (pinned JAX stack)
        run: |
          python -m pip install --upgrade pip
          pip install "jax==0.6.1" "jaxlib==0.6.1" "numpy<2" "flax==0.10.6" "optax==0.2.4"
          pip install -e .
          pip install -e third_party/tensorneat
          pip install pytest

      - name: Record the runner's CPU model (XLA compiles for the host CPU)
        id: cpu
        run: echo "model=$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | tr -c 'A-Za-z0-9\n' '-')" >> "$GITHUB_OUTPUT"

      - name: Restore the JAX compilation cache
        uses: actions/cache@v6
        with:
          path: .jax_cache
          key: jaxcache-${{ runner.os }}-${{ steps.cpu.outputs.model }}-jax0.6.1-smoke-${{ hashFiles('emr_hyperneat/**/*.py', 'third_party/tensorneat/**/*.py') }}
          restore-keys: |
            jaxcache-${{ runner.os }}-${{ steps.cpu.outputs.model }}-jax0.6.1-smoke-

      - name: Smoke test (XOR, base EMR)
        run: python emr_hyperneat/tests/test_smoke.py

      - name: Fast gate
        run: |
          pytest emr_hyperneat/tests/test_isolation.py emr_hyperneat/tests/test_configuration_parsing.py \
            emr_hyperneat/tests/test_execution_config.py emr_hyperneat/tests/test_compaction.py \
            emr_hyperneat/tests/test_recurrence_engages.py emr_hyperneat/tests/test_prototype_reference.py \
            emr_hyperneat/tests/test_data_release.py emr_hyperneat/tests/test_golden.py \
            emr_hyperneat/tests/test_text_style.py emr_hyperneat/tests/test_multi_gpu_worker.py \
            emr_hyperneat/tests/test_paper_imports.py emr_hyperneat/tests/test_pytest_config.py \
            emr_hyperneat/tests/test_engine_layout.py \
            -m "not slow and not multi_gpu" -q --tb=short
          # Four files run whole in the nightly only (test_substrate_recurrent_neuromodulation.py,
          # test_substrate_compiled_forward.py, test_multitask_after_compaction.py and
          # test_global_softmax_axis.py): they compare computed floats, bit for bit or within
          # allowances measured on an Apple M4 Max and one x86 CPU model (a Xeon E5-2683 v4), or
          # rest on which positions a population keeps, and this job runs XLA's default
          # multi-threaded Eigen. The tests below, of the first three, compare no floats (refusals
          # and their messages, compile keys and counts, shapes, two helpers' own checks; the fourth
          # file has none), so every push runs them too.
          pytest \
            emr_hyperneat/tests/test_substrate_recurrent_neuromodulation.py::test_the_compile_key \
            emr_hyperneat/tests/test_substrate_recurrent_neuromodulation.py::test_what_the_loop_refuses_is_refused \
            emr_hyperneat/tests/test_substrate_recurrent_neuromodulation.py::test_what_the_loop_accepts_is_described \
            emr_hyperneat/tests/test_substrate_recurrent_neuromodulation.py::test_the_receptor_derivations_are_the_engines \
            emr_hyperneat/tests/test_substrate_recurrent_neuromodulation.py::test_the_feed_forward_checks_stay_as_in_0_3_0 \
            emr_hyperneat/tests/test_substrate_recurrent_neuromodulation.py::test_a_configuration_that_bypassed_validate_is_refused_at_forward_time \
            emr_hyperneat/tests/test_substrate_recurrent_neuromodulation.py::test_substrate_config_still_refuses_what_the_api_cannot_build \
            emr_hyperneat/tests/test_substrate_recurrent_neuromodulation.py::test_assert_close_across_programs_with_nan \
            emr_hyperneat/tests/test_substrate_recurrent_neuromodulation.py::test_cpu_multi_threaded_eigen_reads_xla_flags \
            emr_hyperneat/tests/test_substrate_compiled_forward.py::test_no_rows \
            emr_hyperneat/tests/test_substrate_compiled_forward.py::test_another_output_count_compiles_each_bucket_once_more \
            emr_hyperneat/tests/test_substrate_compiled_forward.py::test_the_function_cache_key_and_bound \
            emr_hyperneat/tests/test_substrate_compiled_forward.py::test_the_neuromodulation_checks_are_the_dense_forwards \
            emr_hyperneat/tests/test_substrate_compiled_forward.py::test_the_capability_is_named \
            emr_hyperneat/tests/test_multitask_after_compaction.py::test_receptors_on_another_axis_than_the_weights_raise_a_clear_error \
            emr_hyperneat/tests/test_multitask_after_compaction.py::test_the_call_after_a_generation_without_true_neuromodulation_says_so \
            -m "not slow and not multi_gpu" -q --tb=short

  full-suite:
    name: Full suite (shard ${{ matrix.shard }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: Checkout (with the TensorNEAT submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install emr-hyperneat + TensorNEAT (pinned JAX stack)
        run: |
          python -m pip install --upgrade pip
          pip install "jax==0.6.1" "jaxlib==0.6.1" "numpy<2" "flax==0.10.6" "optax==0.2.4"
          pip install -e .
          pip install -e third_party/tensorneat
          pip install pytest pytest-xdist

      - name: Raise vm.max_map_count (XLA's CPU backend accumulates mappings across a long run)
        run: |
          sudo sysctl -w vm.max_map_count=262144 || true
          echo "vm.max_map_count=$(sysctl -n vm.max_map_count)"

      - name: Resolve this shard's files; every test file must be assigned exactly once
        id: files
        run: |
          all=$(ls emr_hyperneat/tests/test_*.py | xargs -n1 basename | sort)
          assigned=$(for s in $(seq 1 ${{ strategy.job-total }}); do
                       echo "$SHARDS" | awk -v s="$s" '$1 == s { $1 = ""; print }'
                     done | tr ' ' '\n' | grep '\.py$' | sort)
          diff <(echo "$all") <(echo "$assigned")
          mine=$(echo "$SHARDS" | awk -v s="${{ matrix.shard }}" '$1 == s { $1 = ""; print }' \
                 | tr ' ' '\n' | grep '\.py$' | sed 's|^|emr_hyperneat/tests/|' | tr '\n' ' ')
          echo "list=$mine" >> "$GITHUB_OUTPUT"
          echo "shard ${{ matrix.shard }}: $mine"

      - name: Record the runner's CPU model (XLA compiles for the host CPU)
        id: cpu
        run: echo "model=$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | tr -c 'A-Za-z0-9\n' '-')" >> "$GITHUB_OUTPUT"

      - name: Restore the JAX compilation cache
        uses: actions/cache@v6
        with:
          path: .jax_cache
          key: jaxcache-${{ runner.os }}-${{ steps.cpu.outputs.model }}-jax0.6.1-full-${{ matrix.shard }}-${{ hashFiles('emr_hyperneat/**/*.py', 'third_party/tensorneat/**/*.py') }}
          restore-keys: |
            jaxcache-${{ runner.os }}-${{ steps.cpu.outputs.model }}-jax0.6.1-full-${{ matrix.shard }}-

      - name: Record the runner's memory, swap and image
        run: |
          echo "image: ${ImageOS:-unknown} ${ImageVersion:-unknown}; cpus: $(nproc)"
          free -m
          swapon --show || true

      - name: Run the shard (one XLA thread per worker; two workers by file, shards 5 to 7 in one process)
        env:
          XLA_FLAGS: "--xla_cpu_multi_thread_eigen=false"
        run: |
          pytest ${{ steps.files.outputs.list }} \
            ${{ matrix.shard >= 5 && '-p no:xdist' || '-n auto --dist loadfile' }} \
            -m "not slow and not multi_gpu" -q --tb=short
